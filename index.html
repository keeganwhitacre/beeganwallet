<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>Couple Finance PWA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom Font Integrations */
        @font-face { font-family: 'Saans'; src: url('fonts/Saans-TRIAL-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; }
        @font-face { font-family: 'Saans'; src: url('fonts/Saans-TRIAL-Medium.woff2') format('woff2'); font-weight: 500; font-style: normal; }
        @font-face { font-family: 'Saans'; src: url('fonts/Saans-TRIAL-SemiBold.woff2') format('woff2'); font-weight: 600; font-style: normal; }
        @font-face { font-family: 'SaansMono'; src: url('fonts/SaansMono-TRIAL-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        html, body {
            background-color: #333333;
            margin: 0;
            font-family: 'Saans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overscroll-behavior: none; /* Stops whole body from rubber-banding */
        }
        
        .theme-transition { transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
        
        .slide-up { animation: slideUp 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .swipe-delete { transition: transform 0.2s ease; }

        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: black;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(0,0,0,0.3);
            border-radius: 2px;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        saans: ['Saans', 'sans-serif'],
                        mono: ['SaansMono', 'monospace']
                    },
                    colors: {
                        darkBg: '#2A2A2A',
                        darkerBg: '#1C1C1E',
                        bel: '#D4D8F4',
                        keegan: '#B7F900',
                        blueLight: '#CCFDF6',
                        cardGap: '#333333',
                        cardEnd: '#EAFFB0'
                    }
                }
            }
        }
    </script>
</head>
<body class="flex justify-center items-center min-h-screen font-saans font-normal">

    <div id="app" class="w-full max-w-md h-[100dvh] sm:h-[850px] bg-[#333333] text-neutral-900 relative overflow-hidden sm:rounded-[3rem] shadow-2xl sm:border-[8px] sm:border-[#1C1C1E] flex flex-col">
        <!-- Dynamic content injected here -->
    </div>

    <input type="file" id="receipt-upload" accept="image/*" class="hidden" />

    <script>
        // --- Initial Mock Data ---
        const defaultSettings = {
            deviceUser: 'Bel', 
            belVenmo: 'isabelgrace756',
            keeganVenmo: 'keegwhit',
            geminiApiKey: '',
            githubPat: '',
            gistId: ''
        };

        const mockTransactions = [];
        
        const mockLists = [
            {
                id: 'list-1',
                name: 'Apartment Wishlist',
                items: [
                    { id: 'i1', text: 'Tapestry behind bed', checked: false, assignedTo: 'Bel' },
                    { id: 'i2', text: 'Curtains for living room', checked: false, assignedTo: 'Bel' },
                    { id: 'i3', text: 'Rechargeable batteries', checked: true, assignedTo: 'Keegan' }
                ]
            },
            {
                id: 'list-2',
                name: 'Grocery List',
                items: [
                    { id: 'i4', text: 'SALMONNNN', checked: false, assignedTo: 'Bel' },
                    { id: 'i5', text: 'Milk', checked: false, assignedTo: 'Bel' },
                    { id: 'i6', text: 'Yogurt!', checked: false, assignedTo: 'Keegan' },
                    { id: 'i7', text: 'Chips', checked: false, assignedTo: 'Keegan' },
                    { id: 'i8', text: 'Salsa', checked: false, assignedTo: 'Bel' }
                ]
            }
        ];

        // --- Global State ---
        let state = {
            settings: { ...defaultSettings },
            transactions: [],
            lists: [],
            recurring: [],
            deleted: [],
            lastModified: 0,
            currentView: 'home',
            activeTxId: null,
            activeListId: null,
            activeSliderItemId: null,
            modal: null, 
            modalJustOpened: false, 
            isProcessing: false,
            isSyncing: false,
            editingItemId: null,
            budgetMonth: new Date().getMonth(),
            budgetYear: new Date().getFullYear(),
            addingListItemFor: null,
            syncPromise: null,
            syncRevision: 0,
            syncStatus: '',
            recoveryMode: false
        };

        // --- Persistence / Sync ---
        function loadState() {
            const saved = localStorage.getItem('coupleFinanceState');
            if (saved) {
                const parsed = JSON.parse(saved);
                state.settings = parsed.settings || defaultSettings;
                state.transactions = (parsed.transactions || mockTransactions).map(normalizeTransaction);
                state.lists = (parsed.lists || mockLists).map(normalizeList);
                state.recurring = (parsed.recurring || []).map(item => ({ ...item, updatedAt: item.updatedAt || 0 }));
                state.deleted = parsed.deleted || [];
                state.lastModified = parsed.lastModified || 0;
            } else {
                state.transactions = [...mockTransactions].map(normalizeTransaction);
                state.lists = [...mockLists].map(normalizeList);
                state.recurring = [];
            }
            checkAutoRecurring();
        }

        function saveState() {
            state.lastModified = Date.now();
            persistState();
            state.syncRevision++;
            saveToGist();
        }

        function persistState() {
            localStorage.setItem('coupleFinanceState', JSON.stringify({
                settings: state.settings, ...syncSnapshot()
            }));
        }

        function syncError(error) {
            state.syncStatus = error.message || 'Sync failed. Your changes are saved on this phone.';
            console.error('Gist sync failed:', error);
            updateSyncBanner();
        }

        function updateSyncBanner() {
            if (typeof document === 'undefined') return;
            const banner = document.getElementById('sync-status');
            if (!banner) return;
            banner.textContent = state.syncStatus;
            banner.classList.toggle('hidden', !state.syncStatus);
        }

        function requireSyncSettings() {
            if (!state.settings.githubPat || !state.settings.gistId) {
                throw new Error('Sync is not configured. Check the GitHub token and Gist ID in Settings. Your data is still on this phone.');
            }
        }

        async function saveToGist() {
            if (state.recoveryMode) return false;
            try { requireSyncSettings(); } catch (error) { syncError(error); return false; }
            if (state.syncPromise) return state.syncPromise;
            state.syncPromise = (async () => {
              try {
                // A change made while a request is in flight gets its own pass.
                let revision;
                do {
                    revision = state.syncRevision;
                    await loadFromGist(); // A failed download must stop the upload.
                    const payload = {
                        description: "Couple Finance PWA Sync",
                        files: { "couple_finance_data.json": { content: JSON.stringify(syncSnapshot()) } }
                    };
                    const response = await fetch(`https://api.github.com/gists/${state.settings.gistId}`, {
                        method: 'PATCH',
                        headers: {
                            'Authorization': `token ${state.settings.githubPat}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error(`Gist upload failed (${response.status}). Your data is still on this phone.`);
                } while (state.syncRevision !== revision);
                state.syncStatus = '';
                updateSyncBanner();
                return true;
              } catch (e) {
                syncError(e);
                return false;
              } finally {
                state.syncPromise = null;
              }
            })();
            return state.syncPromise;
        }

        function syncSnapshot() {
            return {
                transactions: state.transactions,
                lists: state.lists,
                recurring: state.recurring,
                deleted: state.deleted,
                lastModified: state.lastModified
            };
        }

        async function exportLocalBackup() {
            const backup = {
                format: 'beeganwallet-local-backup-v1',
                exportedAt: new Date().toISOString(),
                deviceUser: state.settings.deviceUser,
                ...syncSnapshot()
            };
            const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
            const filename = `beeganwallet-${state.settings.deviceUser.toLowerCase()}-${Date.now()}.json`;
            const file = new File([blob], filename, { type: 'application/json' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try { await navigator.share({ files: [file], title: 'BeeganWallet backup' }); return; }
                catch (error) { if (error.name === 'AbortError') return; }
            }
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url; link.download = filename;
            document.body.appendChild(link); link.click(); link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 60000);
        }

        async function loadFromGist() {
            requireSyncSettings();
            const res = await fetch(`https://api.github.com/gists/${state.settings.gistId}?t=${Date.now()}`, {
                headers: {
                    'Authorization': `token ${state.settings.githubPat}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });
            if (!res.ok) throw new Error(`Gist download failed (${res.status}). Your data is still on this phone.`);
            const data = await res.json();
            const file = data.files && data.files['couple_finance_data.json'];
            if (!file || !file.content) throw new Error('The shared Gist data file is missing or too large to load. Your data is still on this phone.');
            const parsed = JSON.parse(file.content);
            if (!Array.isArray(parsed.transactions) || !Array.isArray(parsed.lists)) {
                throw new Error('The shared Gist data is invalid. Your data is still on this phone.');
            }
            state.deleted = [...new Set([...(state.deleted || []), ...(parsed.deleted || [])])];
            state.transactions = mergeById(state.transactions, parsed.transactions.map(normalizeTransaction), state.deleted);
            state.lists = mergeLists(state.lists, parsed.lists.map(normalizeList), state.deleted);
            if (parsed.recurring) state.recurring = mergeById(state.recurring, parsed.recurring.map(item => ({ ...item, updatedAt: item.updatedAt || 0 })), state.deleted);
            state.lastModified = Math.max(parsed.lastModified || 0, state.lastModified || 0);
            persistState();
            checkAutoRecurring();
            state.syncStatus = '';
            updateSyncBanner();
            return true;
        }

        function checkAutoRecurring() {
            let updated = false;
            const now = new Date();
            const currentMonthStr = now.getFullYear() + '-' + now.getMonth();
            const currentDay = now.getDate();

            state.recurring.forEach(bill => {
                if (currentDay >= bill.recurrenceDay && bill.lastPostedMonth !== currentMonthStr) {
                    const newTx = {
                        id: generateId('tx'),
                        createdAt: Date.now(), updatedAt: Date.now(),
                        store: bill.name,
                        date: now.toLocaleDateString('en-US', {month: 'numeric', day: 'numeric', year: '2-digit'}),
                        total: bill.amount,
                        status: bill.payer === 'Bel' ? 'BEL PAID' : 'KEEGAN PAID',
                        splitType: bill.splitType,
                        items: []
                    };
                    state.transactions.unshift(newTx);
                    bill.lastPostedMonth = currentMonthStr;
                    touch(bill);
                    updated = true;
                }
            });

            if (updated) {
                localStorage.setItem('coupleFinanceState', JSON.stringify({ settings: state.settings, ...syncSnapshot() }));
                saveToGist();
            }
        }

        // --- Math & Balances ---
        function getBalances() {
            let belPaid = 0; let keeganPaid = 0;
            let belShare = 0; let keeganShare = 0;
            
            state.transactions.forEach(tx => {
                const isBelPayer = tx.status === 'BEL PAID';
                const isKeeganPayer = tx.status === 'KEEGAN PAID';
                if (!isBelPayer && !isKeeganPayer) return; 

                if (isBelPayer) belPaid += tx.total;
                if (isKeeganPayer) keeganPaid += tx.total;

                if (!tx.items || tx.items.length === 0) {
                    if (tx.splitType === 'Bel') belShare += tx.total;
                    else if (tx.splitType === 'Keegan') keeganShare += tx.total;
                    else { belShare += tx.total / 2; keeganShare += tx.total / 2; }
                } else {
                    let belItems = 0; let keeganItems = 0; let sharedItems = 0;
                    let itemsSum = 0;
                    
                    tx.items.forEach(i => {
                        itemsSum += i.price;
                        if (i.assignedTo === 'Bel') belItems += i.price;
                        else if (i.assignedTo === 'Keegan') keeganItems += i.price;
                        else if (i.assignedTo === 'SPLIT') {
                            const ratio = i.splitRatio !== undefined ? i.splitRatio : 0.5;
                            belItems += i.price * ratio;
                            keeganItems += i.price * (1 - ratio);
                        } else sharedItems += i.price; 
                    });
                    
                    const remainder = tx.total - itemsSum;
                    belShare += belItems + (sharedItems / 2) + (remainder / 2);
                    keeganShare += keeganItems + (sharedItems / 2) + (remainder / 2);
                }
            });

            let belNet = Math.round((belPaid - belShare) * 100) / 100;
            let keeganNet = Math.round((keeganPaid - keeganShare) * 100) / 100;

            return {
                belOwesKeegan: belNet < 0 ? Math.abs(belNet) : 0,
                keeganOwesBel: keeganNet < 0 ? Math.abs(keeganNet) : 0,
                belNet,
                keeganNet
            };
        }

        function isSettlement(tx) {
            return tx.type === 'settlement' || tx.store === 'Settlement Payment';
        }

        function getTransactionShares(tx) {
            const total = Number(tx.total) || 0;
            if (isSettlement(tx)) return { bel: 0, keegan: 0 };
            if (!tx.items || tx.items.length === 0) {
                if (tx.splitType === 'Bel') return { bel: total, keegan: 0 };
                if (tx.splitType === 'Keegan') return { bel: 0, keegan: total };
                return finalizeShares(total / 2, total);
            }
            let bel = 0, keegan = 0, itemsSum = 0;
            tx.items.forEach(item => {
                const price = Number(item.price) || 0;
                itemsSum += price;
                if (item.assignedTo === 'Bel') bel += price;
                else if (item.assignedTo === 'Keegan') keegan += price;
                else if (item.assignedTo === 'SPLIT') {
                    const ratio = item.splitRatio !== undefined ? Number(item.splitRatio) : 0.5;
                    bel += price * ratio;
                    keegan += price * (1 - ratio);
                } else { bel += price / 2; keegan += price / 2; }
            });
            const remainder = total - itemsSum;
            return finalizeShares(bel + remainder / 2, total);
        }

        // Allocate in whole cents. Bel's calculated share is rounded once, then
        // Keegan receives the exact remainder so the displayed shares always add
        // back to the purchase total (including odd-cent 50/50 splits).
        function finalizeShares(rawBelShare, total) {
            const totalCents = Math.round((Number(total) || 0) * 100);
            const belCents = Math.round((Number(rawBelShare) || 0) * 100);
            return { bel: belCents / 100, keegan: (totalCents - belCents) / 100 };
        }

        // --- Helper Functions ---
        function getTheme() {
            if (state.settings.deviceUser === 'Bel') {
                return { primary: 'bg-bel', hex: '#D4D8F4', gradient: 'from-blueLight to-bel', name: 'Bel', partnerVenmo: state.settings.keeganVenmo };
            }
            return { primary: 'bg-keegan', hex: '#B7F900', gradient: 'from-blueLight to-keegan', name: 'Keegan', partnerVenmo: state.settings.belVenmo };
        }

        function getUserColor(userId) {
            if (userId === 'Bel') return '#D4D8F4';
            if (userId === 'Keegan') return '#B7F900';
            if (userId === 'SPLIT') return '#FFFFFF'; 
            return '#1C1C1E'; // Fixed CLAIM color
        }

        function formatMoney(amount) {
            return '$' + Math.abs(parseFloat(amount)).toFixed(2);
        }

        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
        }

        function generateId(prefix) {
            return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
        }

        function normalizeTransaction(tx) {
            return { ...tx, createdAt: tx.createdAt || parseDate(tx.date || '').getTime() || 0, updatedAt: tx.updatedAt || tx.createdAt || 0 };
        }

        function normalizeList(list) {
            return {
                ...list,
                type: list.type || 'regular',
                updatedAt: list.updatedAt || 0,
                items: (list.items || []).map(item => ({ ...item, completions: item.completions || [], updatedAt: item.updatedAt || 0 }))
            };
        }

        function touch(record) {
            if (record) record.updatedAt = Date.now();
        }

        // Dates are stored as M/D/YY — new Date('5/29/26') parses as 1926 in JS, so we handle it explicitly
        function parseDate(str) {
            const [m, d, y] = String(str || '').split('/').map(Number);
            if (!m || !d || !Number.isFinite(y)) return new Date(0);
            return new Date(y < 100 ? 2000 + y : y, m - 1, d);
        }

        function transactionTime(tx) {
            return Number(tx.createdAt) || parseDate(tx.date).getTime() || 0;
        }

        function formatCompletion(item) {
            const latest = (item.completions || []).slice().sort((a, b) => b.completedAt - a.completedAt)[0];
            if (!latest) return 'Not completed yet';
            const date = new Date(latest.completedAt);
            return `Last done ${date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} by ${latest.by}`;
        }

        function sortedTransactions(transactions = state.transactions) {
            return [...transactions].sort((a, b) => transactionTime(b) - transactionTime(a));
        }

        // Union by id; the record with the newest edit timestamp wins.
        function mergeById(local, remote, deleted = []) {
            const tombstones = new Set(deleted);
            const map = new Map(
                local.filter(i => !tombstones.has(i.id)).map(item => [item.id, item])
            );
            for (const item of remote) {
                if (tombstones.has(item.id)) continue;
                const current = map.get(item.id);
                if (!current || Number(item.updatedAt || 0) >= Number(current.updatedAt || 0)) map.set(item.id, item);
            }
            return Array.from(map.values());
        }

        function mergeLists(local, remote, deleted = []) {
            const tombstones = new Set(deleted);
            const map = new Map(
                local.filter(l => !tombstones.has(l.id)).map(list => [list.id, list])
            );
            for (const remoteList of remote) {
                if (tombstones.has(remoteList.id)) continue;
                const localList = map.get(remoteList.id);
                const newerList = !localList || Number(remoteList.updatedAt || 0) >= Number(localList.updatedAt || 0) ? remoteList : localList;
                map.set(remoteList.id, localList
                    ? { ...newerList, items: mergeById(localList.items || [], remoteList.items || [], deleted) }
                    : { ...remoteList, items: (remoteList.items || []).filter(i => !tombstones.has(i.id)) }
                );
            }
            return Array.from(map.values());
        }

        // Record a deleted ID so merges on both phones skip it permanently
        function tombstone(id) {
            if (id && !state.deleted.includes(id)) state.deleted.push(id);
        }

        // --- Action Handlers ---
        function toggleActiveUser() {
            state.settings.deviceUser = state.settings.deviceUser === 'Bel' ? 'Keegan' : 'Bel';
            saveState();
            render();
        }

        function switchView(view, txId = null) {
            state.currentView = view;
            if (txId) state.activeTxId = txId;
            render();
        }

        function openModal(modalName) { 
            state.modalJustOpened = true;
            state.modal = modalName; 
            render(); 
            state.modalJustOpened = false;
        }

        function showAlert(title, message) {
            state.alertTitle = title;
            state.alertMessage = message;
            openModal('alert');
        }

        function closeModalAnimated() {
            const sheet = document.getElementById('active-modal-sheet');
            const backdrop = document.getElementById('modal-backdrop');
            if (sheet && backdrop) {
                sheet.style.animation = 'none';
                sheet.classList.remove('slide-up');
                void sheet.offsetWidth; // Force a layout calculation so the transition isn't skipped
                sheet.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1)';
                sheet.style.transform = 'translateY(100%)';
                backdrop.style.transition = 'opacity 0.25s ease';
                backdrop.style.opacity = '0';
                setTimeout(() => {
                    state.modal = null;
                    render();
                }, 250);
            } else {
                state.modal = null;
                render();
            }
        }
        
        function closeModal() { 
            state.modal = null; 
            render(); 
        }

        function cycleItemAssignment(itemId) {
            const tx = state.transactions.find(t => t.id === state.activeTxId);
            if (!tx || !tx.items) return;
            const me = state.settings.deviceUser || 'Bel';
            const partner = me === 'Bel' ? 'Keegan' : 'Bel';

            tx.items = tx.items.map(item => {
                if (item.id === itemId) {
                    const next = item.assignedTo === 'CLAIM' ? me : 
                                 item.assignedTo === me ? partner : 
                                 item.assignedTo === partner ? 'CLAIM' : me;
                    return { ...item, assignedTo: next };
                }
                return item;
            });
            touch(tx);
            saveState();
            render();
        }
        
        function cycleListUser(listId, itemId) {
            const list = state.lists.find(l => l.id === listId);
            if (!list) return;
            const item = list.items.find(i => i.id === itemId);
            if (!item) return;

            const me = state.settings.deviceUser;
            const partner = me === 'Bel' ? 'Keegan' : 'Bel';
            const next = item.assignedTo === 'CLAIM' ? me :
                         item.assignedTo === me ? partner : 'CLAIM';

            item.assignedTo = next;
            touch(item); touch(list);
            saveState();
            render();
        }

        function splitItem(itemId) {
            const tx = state.transactions.find(t => t.id === state.activeTxId);
            if (!tx || !tx.items) return;
            tx.items = tx.items.map(item => {
                if (item.id === itemId) return { ...item, assignedTo: 'SPLIT', splitRatio: 0.5 };
                return item;
            });
            touch(tx);
            saveState();
            render();
        }

        function deleteItem(itemId) {
            const tx = state.transactions.find(t => t.id === state.activeTxId);
            if (!tx || !tx.items) return;
            
            const itemIndex = tx.items.findIndex(i => i.id === itemId);
            if (itemIndex > -1) {
                tombstone(itemId);
                tx.total -= tx.items[itemIndex].price;
                tx.items.splice(itemIndex, 1);
                touch(tx);
            }
            saveState();
            render();
        }

        function handleVenmoPayment(amount) {
            const theme = getTheme();
            const url = `venmo://paycharge?txn=pay&recipients=${theme.partnerVenmo}&amount=${amount}`;
            window.location.href = url;
        }

        // --- Render Functions ---
        function renderPill(status) {
            if (status === 'CLAIM') {
                return `<button class="px-5 py-1.5 rounded-full text-[10px] font-mono tracking-widest uppercase bg-[#1C1C1E] text-white border border-transparent">CLAIM</button>`;
            } else if (status === 'BEL PAID') {
                return `<button class="px-5 py-1.5 rounded-full text-[10px] font-mono tracking-widest uppercase bg-bel text-black border border-black">BEL PAID</button>`;
            } else {
                return `<button class="px-5 py-1.5 rounded-full text-[10px] font-mono tracking-widest uppercase bg-keegan text-black border border-black">KEEGAN PAID</button>`;
            }
        }

        function renderBottomNav() {
            if (state.modal) return '';
            
            const v = state.currentView;
            
            return `
                <div class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-[#1C1C1E] rounded-full p-2 flex items-center justify-between w-[280px] shadow-2xl z-[60] border border-black/30 theme-transition">
                    <button data-action="go-budget" class="flex-1 flex justify-center items-center py-2.5 rounded-full transition-all duration-300 ${v === 'budget' ? `bg-[#CCFDF6] text-black border border-black/20` : 'text-[#B7F900] hover:bg-white/10'}">
                        <i data-lucide="pie-chart" class="w-6 h-6"></i>
                        ${v === 'budget' ? '<span class="font-saans font-medium text-sm ml-2">Budget</span>' : ''}
                    </button>
                    <button data-action="go-home" class="flex-1 flex justify-center items-center py-2.5 rounded-full transition-all duration-300 ${v === 'home' ? `bg-[#EAFFB0] text-black border border-black/20` : 'text-[#EAFFB0] hover:bg-white/10'}">
                        <i data-lucide="home" class="w-[22px] h-[22px]"></i>
                        ${v === 'home' ? '<span class="font-saans font-medium text-sm ml-2">Home</span>' : ''}
                    </button>
                    <button data-action="go-lists" class="flex-1 flex justify-center items-center py-2.5 rounded-full transition-all duration-300 ${v === 'lists' ? `bg-[#CCFDF6] text-black border border-black/20` : 'text-[#D4D8F4] hover:bg-white/10'}">
                        <i data-lucide="file-text" class="w-[22px] h-[22px]"></i>
                        ${v === 'lists' ? '<span class="font-saans font-medium text-sm ml-2">Lists</span>' : ''}
                    </button>
                </div>
            `;
        }

        function renderBudget() {
            const selectedDate = new Date(state.budgetYear, state.budgetMonth, 1);
            const monthName = selectedDate.toLocaleString('default', { month: 'long', year: 'numeric' });
            const monthTransactions = sortedTransactions().filter(tx => {
                const date = parseDate(tx.date);
                return !isSettlement(tx) && date.getMonth() === state.budgetMonth && date.getFullYear() === state.budgetYear;
            });
            let belShare = 0, keeganShare = 0;
            monthTransactions.forEach(tx => {
                const shares = getTransactionShares(tx);
                belShare += shares.bel;
                keeganShare += shares.keegan;
            });
            const thisMonthTotal = belShare + keeganShare;
            const belPct = thisMonthTotal ? (belShare / thisMonthTotal) * 100 : 50;
            const keeganPct = thisMonthTotal ? (keeganShare / thisMonthTotal) * 100 : 50;

            let purchasesHTML = monthTransactions.map((tx, i) => {
                const shares = getTransactionShares(tx);
                return `<div class="py-4 ${i === monthTransactions.length - 1 ? '' : 'border-b border-white/10'} cursor-pointer" data-action="view-details" data-id="${tx.id}">
                    <div class="flex justify-between items-center gap-4">
                        <div class="min-w-0"><p class="font-saans font-semibold truncate">${tx.store || 'Purchase'}</p><p class="text-xs text-white/50">${tx.date}</p></div>
                        <span class="font-mono font-bold shrink-0">${formatMoney(tx.total)}</span>
                    </div>
                    <div class="flex gap-2 mt-2 text-[9px] font-mono uppercase tracking-wider">
                        <span class="bg-bel text-black rounded-full px-2.5 py-1">Bel ${formatMoney(shares.bel)}</span>
                        <span class="bg-keegan text-black rounded-full px-2.5 py-1">Keegan ${formatMoney(shares.keegan)}</span>
                    </div>
                </div>`;
            }).join('');
            if(!purchasesHTML) purchasesHTML = `<p class="opacity-50 my-4 font-saans font-semibold text-center text-sm">No spending this month.</p>`;

            let billsHTML = (state.recurring || []).map((bill, i) => {
                const suffix = bill.recurrenceDay === 1 || bill.recurrenceDay === 21 || bill.recurrenceDay === 31 ? 'st' : bill.recurrenceDay === 2 || bill.recurrenceDay === 22 ? 'nd' : bill.recurrenceDay === 3 || bill.recurrenceDay === 23 ? 'rd' : 'th';
                return `
                    <div class="flex justify-between items-center py-4 ${i === state.recurring.length - 1 ? '' : 'border-b border-black'} relative">
                        <div class="flex-1 pr-3">
                            <h4 class="font-saans font-semibold text-[16px] leading-tight mb-1 truncate">${bill.name}</h4>
                            <p class="font-saans font-normal text-xs text-black/70">Auto-posts on the ${bill.recurrenceDay}${suffix} • ${bill.payer} pays</p>
                        </div>
                        <div class="flex items-center gap-3 shrink-0">
                            <span class="font-mono font-bold text-[16px]">${formatMoney(bill.amount)}</span>
                            <button data-action="delete-recurring" data-id="${bill.id}" class="text-black/30 hover:text-red-500 transition-colors p-2 -mr-2">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            if(!billsHTML) billsHTML = `<p class="opacity-50 my-6 font-saans font-semibold text-center text-sm">No recurring bills added yet.</p>`;

            return `
                <!-- Sticky Header Container -->
                <div class="bg-gradient-to-br from-blueLight to-bel shrink-0 rounded-b-[2.5rem] px-6 pt-[calc(env(safe-area-inset-top)+2rem)] pb-8 relative z-20 shadow-[0_8px_30px_rgba(0,0,0,0.12)] border-b border-black/10">
                    <div class="flex justify-between items-center mb-6">
                        <h1 class="text-[3rem] leading-none font-saans font-semibold tracking-tight">Budget</h1>
                        <div class="flex gap-2">
                            <button data-action="budget-prev" aria-label="Previous month" class="w-9 h-9 rounded-full border border-black bg-white/50 flex items-center justify-center"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                            <button data-action="budget-next" aria-label="Next month" class="w-9 h-9 rounded-full border border-black bg-white/50 flex items-center justify-center"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                    
                    <div class="border border-black rounded-2xl p-5 relative overflow-hidden bg-white/40 backdrop-blur-md">
                        <div class="flex justify-between items-end relative z-10 mb-4">
                            <div>
                                <p class="text-[10px] font-mono tracking-widest uppercase mb-1">${monthName} Spending</p>
                                <h2 class="text-5xl font-mono tracking-tighter">${formatMoney(thisMonthTotal)}</h2>
                            </div>
                        </div>
                        
                        <div class="flex justify-between text-[10px] font-mono uppercase tracking-widest mb-1.5 text-black/70">
                            <span>Bel: ${formatMoney(belShare)}</span>
                            <span>Keegan: ${formatMoney(keeganShare)}</span>
                        </div>
                        <div class="w-full h-3 rounded-full flex overflow-hidden border border-black/20 bg-white/40">
                            <div class="h-full bg-bel border-r border-black/20" style="width: ${belPct}%"></div>
                            <div class="h-full bg-keegan" style="width: ${keeganPct}%"></div>
                        </div>
                    </div>
                </div>

                <!-- Scrollable Content Container -->
                <div id="main-scroll" class="flex-1 overflow-y-auto no-scrollbar w-full bg-[#333333] relative z-10 -mt-[2.5rem] pt-[calc(2.5rem+1.5rem)] pb-32">
                    <div class="mx-6 rounded-[2rem] p-6 bg-gradient-to-br from-cardEnd to-bel border border-black/10 shadow-sm theme-transition relative z-10">
                        <div class="flex justify-between items-end border-b border-black pb-2 mb-4">
                            <h3 class="font-saans font-semibold text-lg leading-none">Recurring Bills</h3>
                            <button data-action="open-recurring-form" class="bg-transparent text-black font-mono text-[10px] uppercase tracking-widest active:scale-95 transition-transform">
                                Add +
                            </button>
                        </div>
                        <div class="flex flex-col">
                            ${billsHTML}
                        </div>
                    </div>

                    <div class="mx-6 mt-4 rounded-[2rem] p-6 bg-[#1C1C1E] text-white border border-black/30 shadow-sm theme-transition relative z-10">
                        <div class="flex justify-between items-end border-b border-white/20 pb-2 mb-3">
                            <h3 class="font-saans font-semibold text-lg leading-none">Purchases</h3>
                            <span class="text-[9px] font-mono tracking-widest uppercase text-white/50">${monthTransactions.length} total</span>
                        </div>
                        <div class="flex flex-col">
                            ${purchasesHTML}
                        </div>
                    </div>
                </div>
                ${renderBottomNav()}
            `;
        }

        function renderHome() {
            const theme = getTheme();
            const balances = getBalances();
            const myNet = state.settings.deviceUser === 'Bel' ? balances.belNet : balances.keeganNet;
            const balanceLabel = myNet >= 0 ? 'You Are Owed' : 'You Owe';
            
            let actionButtonHTML = '';
            if (myNet < 0) {
                actionButtonHTML = `
                    <button data-action="open-settle" class="bg-white text-black border border-black px-5 py-2.5 rounded-full text-xs font-mono tracking-wide flex items-center gap-2 active:scale-95 transition-transform shadow-sm">
                        SETTLE <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>`;
            } else {
                 actionButtonHTML = `
                    <button class="${theme.primary} text-black border border-black px-5 py-2.5 rounded-full text-xs font-mono tracking-wide flex items-center gap-2 cursor-default shadow-sm">
                        PAID <i data-lucide="check" class="w-4 h-4"></i>
                    </button>`;
            }
            
            const nonSettlements = sortedTransactions(state.transactions.filter(tx => !isSettlement(tx)));
            const txList = nonSettlements.slice(0, 3);
            let txHTML = txList.map((tx, i) => `
                <div class="flex items-center justify-between pb-3 ${i === txList.length - 1 ? '' : 'border-b border-black mb-3'}" 
                     data-action="view-details" data-id="${tx.id}" style="cursor: pointer;">
                    <div class="flex items-center gap-3">
                        <i data-lucide="shopping-cart" class="w-7 h-7"></i>
                        <div>
                            <h4 class="text-[1.65rem] leading-none font-saans font-semibold tracking-tighter">${formatMoney(tx.total)}</h4>
                            <p class="text-[11px] mt-0.5">
                                <span class="font-saans font-semibold">${tx.date}</span> <span class="font-saans font-normal">${tx.store}</span>
                            </p>
                        </div>
                    </div>
                    <div>${renderPill(tx.status)}</div>
                </div>
            `).join('');

            if (!txHTML) txHTML = `<div class="text-center text-black/50 font-saans font-semibold py-6 italic opacity-70">No purchases yet.</div>`;

            return `
                <!-- Sticky Header Container -->
                <div class="bg-gradient-to-br ${theme.gradient} shrink-0 rounded-b-[2.5rem] px-6 pt-[calc(env(safe-area-inset-top)+2rem)] pb-8 relative z-20 shadow-[0_8px_30px_rgba(0,0,0,0.12)] border-b border-black/10 transition-colors duration-500">
                    <div class="flex justify-between items-center mb-6">
                        <h1 class="text-[2.5rem] leading-none font-saans font-semibold tracking-tight">Hello, ${theme.name}!</h1>
                        <div class="flex gap-2">
                            <button data-action="open-settings" class="w-7 h-7 flex justify-center items-center rounded-full bg-white border border-black active:scale-95 transition-transform" title="Settings">
                                <i data-lucide="settings" class="w-3.5 h-3.5 text-black"></i>
                            </button>
                            <button data-action="refresh-data" class="w-7 h-7 flex justify-center items-center rounded-full bg-white border border-black active:scale-95 transition-transform" title="Sync Data">
                                <i data-lucide="refresh-cw" class="w-3.5 h-3.5 text-black ${state.isSyncing ? 'animate-spin' : ''}"></i>
                            </button>
                        </div>
                    </div>
                    <div class="border border-black rounded-2xl p-5 relative overflow-hidden bg-white/40 backdrop-blur-md">
                        <div class="flex justify-between items-end relative z-10">
                            <div>
                                <p class="text-[10px] font-mono tracking-widest uppercase mb-1">${balanceLabel}</p>
                                <h2 class="text-5xl font-mono tracking-tighter">${formatMoney(myNet)}</h2>
                            </div>
                            ${actionButtonHTML}
                        </div>
                    </div>
                </div>

                <!-- Scrollable Content Container -->
                <div id="main-scroll" class="flex-1 overflow-y-auto no-scrollbar w-full bg-[#333333] relative z-10 -mt-[2.5rem] pt-[calc(2.5rem+1.5rem)] pb-32">
                    <div class="flex gap-3 px-6 relative z-10">
                        <button onclick="if(!state.isProcessing) document.getElementById('receipt-upload').click()" class="flex-1 bg-darkerBg text-white rounded-[1.25rem] py-4 flex justify-center items-center gap-2 font-saans font-semibold text-sm active:scale-95 transition-transform border border-black/50">
                            ${state.isProcessing ? `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Parsing...` : `<i data-lucide="scan" class="w-5 h-5"></i> Upload Receipt`}
                        </button>
                        <button data-action="open-manual" class="flex-1 bg-darkerBg text-white rounded-[1.25rem] py-4 flex justify-center items-center gap-2 font-saans font-semibold text-sm active:scale-95 transition-transform border border-black/50">
                            <i data-lucide="calculator" class="w-5 h-5"></i> Manual Entry
                        </button>
                    </div>
                    
                    <div class="mx-6 mt-6 rounded-[2rem] p-6 bg-gradient-to-br from-cardEnd to-bel border border-black/10 shadow-sm theme-transition relative z-10">
                        <div class="flex justify-between items-end border-b border-black pb-2 mb-4">
                            <h3 class="font-saans font-semibold text-lg leading-none">Recent</h3>
                            <button data-action="open-all" class="text-[9px] font-mono tracking-widest uppercase flex items-center gap-1 active:opacity-50 p-2 -mr-2 bg-transparent text-black">
                                SHOW ALL <i data-lucide="arrow-right" class="w-3 h-3"></i>
                            </button>
                        </div>
                        <div class="flex flex-col">${txHTML}</div>
                    </div>

                    <div class="flex gap-4 px-6 mt-6 mb-6 relative z-10">
                        <div class="flex-1 bg-keegan rounded-xl p-4 border border-black/20 shadow-sm flex flex-col justify-between">
                            <p class="text-[9px] font-mono tracking-widest uppercase mb-1 leading-tight">Keegan<br/>Owes Bel</p>
                            <h3 class="text-3xl font-saans font-semibold tracking-tighter mt-2">${formatMoney(balances.keeganOwesBel)}</h3>
                        </div>
                        <div class="flex-1 bg-bel rounded-xl p-4 border border-black/20 shadow-sm flex flex-col justify-between">
                            <p class="text-[9px] font-mono tracking-widest uppercase mb-1 leading-tight">Bel<br/>Owes Keegan</p>
                            <h3 class="text-3xl font-saans font-semibold tracking-tighter mt-2">${formatMoney(balances.belOwesKeegan)}</h3>
                        </div>
                    </div>
                </div>
                ${renderBottomNav()}
            `;
        }

        function renderDetails() {
            const tx = state.transactions.find(t => t.id === state.activeTxId) || state.transactions[0];
            if (!tx) return `<div class="flex-1 flex justify-center items-center text-white font-saans">No data</div>`;

            let itemsHTML = (tx.items || []).map((item, index) => {
                const isSplit = item.assignedTo === 'SPLIT';
                const isClaim = item.assignedTo === 'CLAIM';
                let userName = item.assignedTo;
                if (isClaim) userName = 'CLAIM';
                if (isSplit) {
                    if (item.splitRatio !== undefined && item.splitRatio !== 0.5) {
                        userName = `${Math.round(item.splitRatio * 100)} / ${Math.round((1 - item.splitRatio) * 100)}`;
                    } else {
                        userName = '50 / 50';
                    }
                }

                const topBgColor = isSplit ? '#FFFFFF' : getUserColor(item.assignedTo);
                const topTextColor = isClaim ? 'text-white' : 'text-black';
                const topBorderClass = isClaim ? 'border-transparent' : 'border-black';
                const splitBtnBg = isSplit ? 'bg-black text-white' : 'bg-white text-black';

                return `
                    <div data-swipeable="true" data-id="${item.id}" class="flex justify-between items-start pb-4 relative ${index === tx.items.length - 1 ? '' : 'border-b border-black'} swipe-delete">
                        <div class="flex-1 pr-4 max-w-[70%] cursor-pointer" data-action="open-edit-item" data-id="${item.id}">
                            <h4 class="font-saans font-semibold text-[14px] leading-tight mb-1 line-clamp-2">${item.name}</h4>
                            <p class="text-sm font-saans font-normal text-black/70">${formatMoney(item.price)}</p>
                        </div>
                        <div class="flex flex-col gap-1.5 w-[90px] shrink-0">
                            <button data-action="cycle-item" data-id="${item.id}" 
                                class="w-full py-1.5 rounded-full text-[10px] font-mono tracking-widest uppercase transition-colors border ${topBorderClass} ${topTextColor}"
                                style="background-color: ${topBgColor};">
                                ${userName.substring(0,7)}
                            </button>
                            <button data-action="split-item" data-id="${item.id}" class="w-full ${splitBtnBg} py-1.5 rounded-full text-[10px] font-mono tracking-widest uppercase border border-black transition-colors active:scale-95">
                                SPLIT
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            if (!itemsHTML) itemsHTML = `<p class="text-sm italic opacity-50 font-saans font-normal">No individual items available. Entire receipt is automatically split according to settings.</p>`;

            itemsHTML += `
                <button data-action="open-add-item" class="w-full py-3 mt-4 border-2 border-dashed border-black/30 rounded-xl font-mono uppercase tracking-widest text-xs flex justify-center items-center gap-2 active:scale-95 transition-transform hover:bg-black/5">
                    <i data-lucide="plus" class="w-4 h-4"></i> Add Item
                </button>
            `;

            return `
                <!-- Sticky Header Container -->
                <div class="bg-gradient-to-br from-[#D4D8F4] to-[#B7F900] shrink-0 relative z-20 shadow-[0_8px_30px_rgba(0,0,0,0.12)] border-b border-black/10 transition-colors duration-500 rounded-b-[2.5rem] pb-6">
                    <div class="px-6 pt-[calc(env(safe-area-inset-top)+1.5rem)] pb-3 flex items-center gap-3">
                        <button data-action="go-home" class="p-1 -ml-1 active:scale-90 transition-transform">
                            <i data-lucide="arrow-left" class="w-6 h-6"></i>
                        </button>
                    </div>
                    
                    <div class="px-6 flex justify-between items-end mb-4">
                        <div>
                            <h1 class="text-4xl font-saans font-semibold tracking-tight line-clamp-1">${tx.store}</h1>
                            <p class="text-sm font-saans font-semibold mb-1.5 whitespace-nowrap">${tx.date}</p>
                        </div>
                        <button data-action="open-edit-tx" class="p-2 mb-1 bg-white/40 border border-black rounded-full active:scale-95 transition-transform" title="Edit Trip Details">
                            <i data-lucide="pencil" class="w-5 h-5"></i>
                        </button>
                    </div>

                    <div class="mx-6 border border-black rounded-2xl p-4 relative overflow-hidden bg-white/40 backdrop-blur-md">
                        <div class="flex justify-between items-end relative z-10">
                            <div>
                                <p class="text-[10px] font-mono tracking-widest uppercase mb-1">Total</p>
                                <h2 class="text-4xl font-mono tracking-tighter">${formatMoney(tx.total)}</h2>
                            </div>
                            <button class="bg-black text-white border border-black px-4 py-2 rounded-full text-xs font-mono tracking-wide flex items-center gap-2 cursor-default">
                                ${tx.status}
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Scrollable Content Container -->
                <div id="main-scroll" class="flex-1 overflow-y-auto no-scrollbar w-full bg-[#333333] relative z-10 -mt-[2.5rem] pt-[calc(2.5rem+1.5rem)] pb-32 px-0 sm:px-6">
                <div class="bg-gradient-to-br from-cardEnd to-bel rounded-[2.5rem] mx-4 px-6 pt-6 pb-8 relative border border-black/10 shadow-sm">
                        <h3 class="font-saans font-semibold text-[16px] mb-2">Items</h3>
                        <div class="h-px bg-black w-full mb-4 opacity-50"></div>
                        <div class="flex flex-col gap-4 overflow-x-hidden">
                            ${itemsHTML}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderLists() {
            return `
                <!-- Sticky Header Container -->
                <div class="bg-gradient-to-br from-[#D4D8F4] to-[#B7F900] shrink-0 rounded-b-[2.5rem] px-6 pt-[calc(env(safe-area-inset-top)+2rem)] pb-6 relative z-20 shadow-[0_8px_30px_rgba(0,0,0,0.12)] border-b border-black/10">
                    <div class="flex justify-between items-center mb-2">
                        <h1 class="text-[3rem] leading-none font-saans font-semibold tracking-tight">Lists</h1>
                        <button data-action="create-list" class="bg-white text-black border border-black px-4 py-2 rounded-full font-mono text-xs uppercase tracking-widest active:scale-95 transition-transform">
                            New +
                        </button>
                    </div>
                </div>

                <!-- Scrollable Content Container -->
                <div id="main-scroll" class="flex-1 overflow-y-auto no-scrollbar w-full bg-[#333333] relative z-10 -mt-[2.5rem] pt-[calc(2.5rem+1.5rem)] pb-32">
                    <div class="relative w-full" id="lists-container" style="min-height: ${state.lists.length * 115 + 350}px">
                        ${state.lists.map((list, i) => `
                            <div data-list-card="true" data-id="${list.id}"
                                 class="absolute rounded-3xl bg-gradient-to-br from-cardEnd to-bel border border-black/20 shadow-[0_-5px_15px_rgba(0,0,0,0.1)] cursor-pointer"
                                 style="top: ${i * 115}px; left: 16px; right: 16px; z-index: ${i}; min-height: max(100vh, 500px); padding: 24px; transition: top 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.2s ease, opacity 0.2s ease;"
                                 data-action="open-list" data-list-id="${list.id}">
                                <div class="border-b border-black mb-3 pb-2 pr-10 relative pointer-events-none">
                                    <h2 class="text-2xl font-saans font-semibold text-black truncate pointer-events-auto">${list.name}</h2>
                                    <!-- Custom Drag Handle for Touch Reordering -->
                                    <div class="absolute top-0 right-0 p-1.5 -mt-1 text-black/30 hover:text-black/60 drag-handle touch-none cursor-grab active:cursor-grabbing pointer-events-auto">
                                        <i data-lucide="grip-horizontal" class="w-6 h-6"></i>
                                    </div>
                                </div>
                                <div class="space-y-0 pointer-events-none">
                                   ${list.items.slice(0, 4).map(item => `
                                       <div class="flex items-center gap-3 border-b border-black/20 py-3">
                                           <div class="w-5 h-5 rounded border border-black flex-shrink-0 ${item.checked && list.type !== 'chores' ? 'bg-black text-white' : ''} flex justify-center items-center">
                                               ${item.checked && list.type !== 'chores' ? '<i data-lucide="check" class="w-3 h-3"></i>' : ''}
                                           </div>
                                           <div class="min-w-0"><span class="text-sm font-saans font-normal truncate block ${item.checked && list.type !== 'chores' ? 'line-through opacity-50' : ''}">${item.text}</span>${list.type === 'chores' ? `<span class="text-[10px] opacity-50">${formatCompletion(item)}</span>` : ''}</div>
                                           <div class="ml-auto">
                                               <span class="text-[9px] font-mono tracking-widest uppercase border border-black rounded-full px-2.5 py-0.5 text-black" style="background-color: ${getUserColor(item.assignedTo)}">${item.assignedTo}</span>
                                           </div>
                                       </div>
                                   `).join('')}
                                   ${list.items.length > 4 ? `<p class="text-xs font-saans font-semibold opacity-50 ml-8 mt-4">+ ${list.items.length - 4} more</p>` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                ${renderBottomNav()}
            `;
        }
